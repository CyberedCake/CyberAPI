repositories {

    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net"
    }

}

dependencies {
    // adventure API (https://docs.adventure.kyori.net/)
    implementation "net.kyori:adventure-text-serializer-legacy:4.+"
    implementation "net.kyori:adventure-text-serializer-plain:4.+"
    implementation "net.kyori:adventure-platform-bungeecord:4.+"
    implementation "net.kyori:adventure-api:4.+"
    implementation 'net.kyori:adventure-text-minimessage:4.+'

    // bungeecord and plugin hooks
    compileOnly 'net.md-5:bungeecord-api:1.21-R0.4'
    compileOnly 'net.luckperms:api:5.+'

    // utils
    implementation 'org.reflections:reflections:0.10.2'
}

shadowJar {
    relocate 'javassist', 'net.cybercake.cyberapi.dependencies.javassist'
    relocate 'org.reflections', 'net.cybercake.cyberapi.dependencies.reflections'
    relocate 'org.apache.commons.lang3', 'net.cybercake.cyberapi.dependencies.apache.commons'
}